name: oidc
on: [workflow_dispatch]
jobs:
  no-permission:
    runs-on: ubuntu-latest
    steps:
      - run: echo "request url set=[${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}]"
  branch:
    runs-on: ubuntu-latest
    permissions: {id-token: write}
    steps:
      - run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=drills-audience" \
            | jq -r .value | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2) $0=$0"=="; else if(l==3) $0=$0"="; print}' | base64 -d \
            | jq -c '{sub, aud, iss, repository, ref, environment, job_workflow_ref, ttl: (.exp-.iat)}'
  production:
    runs-on: ubuntu-latest
    environment: production
    permissions: {id-token: write}
    steps:
      - run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=drills-audience" \
            | jq -r .value | cut -d. -f2 | tr '_-' '/+' | awk '{l=length($0)%4; if(l==2) $0=$0"=="; else if(l==3) $0=$0"="; print}' | base64 -d \
            | jq -c '{sub, environment}'
